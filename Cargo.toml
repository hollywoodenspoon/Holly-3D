[package]
name = "minimax"
version = "0.1.0"
edition = "2024"
description = "MiniMax: a clean 3ds Max-style polygon modeler in Rust"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["serialize", "default_app", "std", "bevy_winit", "multi_threaded", "x11", "default_font", "3d_bevy_render", "keyboard", "mouse"] }
bevy_egui = "0.43.1"
transform-gizmo-egui = "0.11"
slotmap = { version = "1.0", features = ["serde"] }
uvunwrap = "0.2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "hdr"] }
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"
boolmesh = "0.2.2"
meshopt = "0.7.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
ron = "0.12"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "extras", "KHR_materials_emissive_strength"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
ufbx = "0.11.5"
serde_json = "1.0.154"
miniz_oxide = "0.8"
half = "2.7"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Fast iteration: optimised deps, thin LTO only in release.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = "debuginfo"
