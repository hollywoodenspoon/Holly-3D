[package]
name = "ilex"
version = "0.1.0"
edition = "2024"
description = "Ilex: a clean polygon modeler, painter and renderer in Rust"
license = "GPL-3.0-or-later"

[dependencies]
# GPU path tracer (same wgpu as Bevy; features unify).
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }
pollster = "1.0.1"
libc = "0.2"
bevy = { version = "0.20.0", default-features = false, features = ["serialize", "default_app", "std", "bevy_winit", "multi_threaded", "x11", "default_font", "3d_bevy_render", "keyboard", "mouse"] }
bevy_egui = "0.43.1"
# Window icon (the same winit Bevy uses).
winit = { version = "0.30.13", default-features = false }
transform-gizmo-egui = "0.11"
slotmap = { version = "1.0", features = ["serde"] }
uvunwrap = "0.2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "hdr", "bmp", "webp", "tiff"] }
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"
boolmesh = "0.2.2"
meshopt = "0.7.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
ron = "0.12"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "extras", "KHR_materials_emissive_strength"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
ufbx = "0.11.5"
serde_json = "1.0.154"
miniz_oxide = "0.8"
half = "2.7"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Face Cloner: pure-Rust MediaPipe Face Landmarker + TFLite interpreter (MIT OR Apache-2.0).
effectcraft-segment = { git = "https://github.com/storytold/effectcraft", rev = "41585f2aec7c470883eb362530a917373536330b" }

[dev-dependencies]
# Validates every feature-switch build of the GPU kernel (already in the tree via wgpu).
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Fast iteration: optimised deps, thin LTO only in release.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
# Line tables keep crash-report backtraces readable (file:line) at little size cost.
debug = "line-tables-only"
strip = false
